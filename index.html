<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="theme-color" content="#08001f">
  <title>Vabysmo Commitment Wall</title>
  <link rel="stylesheet" href="styles.css?v=20261020-4">
</head>
<body>
  <section id="welcomeScreen" class="welcome-screen" aria-label="Welcome screen">
    <div class="welcome-art">
      <img src="commitment-welcome.png" alt="Vabysmo commitment wall welcome screen">
      <button id="startButton" class="welcome-start" type="button" aria-label="Start"></button>
    </div>
  </section>

  <main id="registrationPage" class="page-shell" aria-hidden="true">
    <header class="brand-header" aria-label="Vabysmo and Roche">
      <img src="brand-header.png" alt="Vabysmo and Roche">
    </header>

    <form id="registrationForm" novalidate>
      <div class="photo-section">
        <label class="photo-picker" for="photoInput">
          <img id="photoPreview" alt="Your selected photo preview">
          <span id="photoPrompt">
            <b aria-hidden="true">+</b>
            <strong>TAP TO ADD PHOTO</strong>
          </span>
        </label>
        <input id="photoInput" type="file" accept="image/*" capture="user" required>
      </div>

      <div class="photo-copy">
        <h1>ADD YOUR PHOTO</h1>
        <p>Your photo will join the commitment wall</p>
      </div>

      <label class="message-field" for="messageInput">
        <span>YOUR MESSAGE</span>
        <textarea id="messageInput" maxlength="80" rows="2" placeholder="Write your commitment…" required></textarea>
        <small><b id="messageCount">0</b>/80</small>
      </label>

      <p id="status" class="status" role="status" aria-live="polite"></p>
      <button id="submitButton" type="submit">SEND PHOTO</button>
    </form>
  </main>

  <main id="resultPage" class="result-page" aria-hidden="true" hidden>
    <section class="result-shell">
      <h1>YOUR PHOTO IS READY</h1>
      <p>Scan the QR code to download your branded photo card.</p>
      <div class="result-content">
        <img id="resultCard" class="result-card" alt="Your completed Vabysmo photo card">
        <div class="qr-panel">
          <img id="resultQr" class="result-qr" alt="QR code for downloading your photo card">
          <strong>SCAN TO DOWNLOAD</strong>
        </div>
      </div>
      <button id="finishButton" type="button">FINISH</button>
    </section>
  </main>
  <script src="brand-header-data.js?v=20261020-4"></script>
  <script src="app.js?v=20261020-5"></script>
</body>
</html>
